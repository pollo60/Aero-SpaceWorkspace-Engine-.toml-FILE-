config-version = 2
start-at-login = true
auto-reload-config = true

# Keep tiling in sync when Dock autohide state changes (if dock-layout-sync.sh is installed).
# This configuration is 100% standalone and works out-of-the-box with zero external dependencies.
after-startup-command = [
  'exec-and-forget /bin/zsh -c "[[ -f ~/.config/aerospace/dock-layout-sync.sh ]] && exec ~/.config/aerospace/dock-layout-sync.sh"'
]

# ==========================================================
# LAPTOP PROFILE — single display, compact tiling
# ==========================================================
# Optimized for a single built-in MacBook display.
# Uses slightly tighter defaults so no screen real estate
# is wasted on a small panel.  Gaps remain at 0 and the
# workspace set is trimmed to 7 semantic spaces.
# ==========================================================

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 0
default-root-container-layout = 'accordion'
default-root-container-orientation = 'horizontal'

# Seven workspaces — the six semantic contexts (AI, Code, CLI, Browser,
# Media, Social) plus one general-purpose Scratch space.  Keeping the
# total at seven avoids sparse, empty spaces that slow down alt+N
# cycling on a small built-in display where context-switching speed matters.
persistent-workspaces = ['AI', 'Code', 'CLI', 'Browser', 'Media', 'Social', 'Scratch']

[gaps]
inner.horizontal = 0
inner.vertical   = 0
outer.left   = 0
outer.bottom = 0
outer.top    = 0
outer.right  = 0


# ==========================================================
# WORKSPACE ROUTING
# AI | Code | CLI | Browser | Media | Social | Scratch
# ==========================================================

[[on-window-detected]]
if.app-name-regex-substring = '.*'
run = 'layout tiling'
check-further-callbacks = true

# ── AI workspace ──
[[on-window-detected]]
if.app-name-regex-substring = '(?i)(gemini|chatgpt|claude|copilot)'
run = ['move-node-to-workspace AI', 'layout tiling']

# ── Code workspace ──
[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = ['move-node-to-workspace Code', 'layout tiling']

[[on-window-detected]]
if.app-id = 'com.todesktop.230313mzl4w4u92'
run = ['move-node-to-workspace Code', 'layout tiling']

[[on-window-detected]]
if.app-id = 'dev.zed.Zed'
run = ['move-node-to-workspace Code', 'layout tiling']

# ── CLI workspace ──
[[on-window-detected]]
if.app-id = 'com.googlecode.iterm2'
run = ['move-node-to-workspace CLI', 'layout tiling']

[[on-window-detected]]
if.app-id = 'com.apple.Terminal'
run = ['move-node-to-workspace CLI', 'layout tiling']

[[on-window-detected]]
if.app-id = 'dev.warp.Warp'
run = ['move-node-to-workspace CLI', 'layout tiling']

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = ['move-node-to-workspace CLI', 'layout tiling']

# ── Browser workspace ──
[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = ['move-node-to-workspace Browser', 'layout tiling']

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = ['move-node-to-workspace Browser', 'layout tiling']

[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
run = ['move-node-to-workspace Browser', 'layout tiling']

[[on-window-detected]]
if.app-id = 'company.thebrowser.Browser'
run = ['move-node-to-workspace Browser', 'layout tiling']

[[on-window-detected]]
if.app-id = 'com.brave.Browser'
run = ['move-node-to-workspace Browser', 'layout tiling']

# ── Media workspace ──
[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = ['move-node-to-workspace Media', 'layout tiling']

[[on-window-detected]]
if.app-id = 'com.apple.Music'
run = ['move-node-to-workspace Media', 'layout tiling']

# ── Social workspace ──
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = ['move-node-to-workspace Social', 'layout tiling']

[[on-window-detected]]
if.app-id = 'com.apple.mail'
run = ['move-node-to-workspace Social', 'layout tiling']

[[on-window-detected]]
if.app-id = 'com.apple.MobileSMS'
run = ['move-node-to-workspace Social', 'layout tiling']

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = ['move-node-to-workspace Social', 'layout tiling']

# ── System dialogs → floating ──
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.archiveutility'
run = 'layout floating'

[mode.main.binding]
# ── Resize (opt+arrow) ────────────────────────────────────
alt-up    = 'resize height -80'
alt-down  = 'resize height +80'
alt-right = 'resize width +80'
alt-left  = 'resize width -80'

# ── Focus (ctrl+opt+arrow) ────────────────────────────────
alt-ctrl-up    = 'focus up'
alt-ctrl-down  = 'focus down'
alt-ctrl-right = 'focus right'
alt-ctrl-left  = 'focus left'

# ── Move window (opt+shift+arrow) ─────────────────────────
alt-shift-up    = 'move up'
alt-shift-down  = 'move down'
alt-shift-right = 'move right'
alt-shift-left  = 'move left'

# Toggle tiling ↔ floating
alt-f = 'layout floating tiling'

# ── Workspace Navigation ──────────────────────────────────
alt-1 = 'workspace AI'
alt-2 = 'workspace Code'
alt-3 = 'workspace CLI'
alt-4 = 'workspace Browser'
alt-5 = 'workspace Media'
alt-6 = 'workspace Social'
alt-7 = 'workspace Scratch'

alt-shift-1 = ['move-node-to-workspace AI',      'workspace AI']
alt-shift-2 = ['move-node-to-workspace Code',    'workspace Code']
alt-shift-3 = ['move-node-to-workspace CLI',     'workspace CLI']
alt-shift-4 = ['move-node-to-workspace Browser', 'workspace Browser']
alt-shift-5 = ['move-node-to-workspace Media',   'workspace Media']
alt-shift-6 = ['move-node-to-workspace Social',  'workspace Social']
alt-shift-7 = ['move-node-to-workspace Scratch', 'workspace Scratch']

alt-ctrl-r = 'layout tiling'
alt-ctrl-d = ['flatten-workspace-tree', 'balance-sizes']
alt-shift-r = 'reload-config'
